# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # Recommended defaults
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save/Restore sessions
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'andreasdelu/tmux-worktree-manager'
set -g @plugin 'kampanosg/tmux-lazygit-popup'

# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable automatic restore
set -g @continuum-restore 'on'

# Restore Neovim windows/buffers from Session.vim when tmux-resurrect restarts nvim.
set -g @resurrect-strategy-nvim 'session'

# Enable Pi Overwatch in TWM
set -g @twm-overwatch-enable 'on'

set -g status-interval 5
set -g @tmux-gruvbox-right-status-x '#(cd #{pane_current_path} && repo=$(basename "$(git rev-parse --show-toplevel 2>/dev/null)") && branch=$(git branch --show-current 2>/dev/null) && [ -n "$repo" ] && [ -n "$branch" ] && label="$repo:$branch" && if [ ${#label} -gt 96 ]; then label="$(echo "$label" | cut -c1-93)..."; fi && echo "$label")'
set -g @tmux-gruvbox-right-status-y '%d.%m.%Y'
set -g @tmux-gruvbox-right-status-z '%H:%M  '

# Press 'prefix' then 'f' to fuzzy-find sessions
bind f run-shell -b "~/.tmux/bin/display-popup sessions #{client_name} #{pane_id}"

# Change prefix to Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set terminal window title to tmux session name
set -g set-titles on
set -g set-titles-string '#S — #W'

# Enable mouse support (scrolling, clicking to switch panes)
set -g mouse on

# ------------ PANE DIMMING START -----------------

# Preserve the standard appearance of palette slots used for Ghostty metadata.
set -wg 'pane-colours[160]' '#d70000'
set -wg 'pane-colours[161]' '#d7005f'
set -wg 'pane-colours[162]' '#d70087'
set -wg 'pane-colours[163]' '#d700af'
set -wg 'pane-colours[164]' '#d700d7'
set -wg 'pane-colours[165]' '#d700ff'

# Update the shader first on focus changes; the full snapshot follows behind it.
set-hook -g 'window-pane-changed[89]' 'run-shell -b "~/.tmux/bin/emit-pane-overlay \"#{client_tty}\" \"#{client_termname}\" \"#{client_width}\" \"#{client_height}\" \"#{client_cell_width}\" \"#{client_cell_height}\" \"#{window_height}\" \"#{window_zoomed_flag}\" \"#{status-position}\" \"#{pane_left}\" \"#{pane_top}\" \"#{pane_width}\" \"#{pane_height}\""'

# Window and session switches need the same fast visual update before the full
# geometry snapshot catches up.
set-hook -g 'session-window-changed[89]' 'run-shell -b "~/.tmux/bin/emit-pane-overlay \"#{client_tty}\" \"#{client_termname}\" \"#{client_width}\" \"#{client_height}\" \"#{client_cell_width}\" \"#{client_cell_height}\" \"#{window_height}\" \"#{window_zoomed_flag}\" \"#{status-position}\" \"#{pane_left}\" \"#{pane_top}\" \"#{pane_width}\" \"#{pane_height}\""'
set-hook -g 'client-session-changed[89]' 'run-shell -b "~/.tmux/bin/emit-pane-overlay \"#{client_tty}\" \"#{client_termname}\" \"#{client_width}\" \"#{client_height}\" \"#{client_cell_width}\" \"#{client_cell_height}\" \"#{window_height}\" \"#{window_zoomed_flag}\" \"#{status-position}\" \"#{pane_left}\" \"#{pane_top}\" \"#{pane_width}\" \"#{pane_height}\""'

# Keep a complete pane geometry snapshot for renderer-side integrations.
set-hook -g 'window-pane-changed[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata --snapshot-only"'
set-hook -g 'window-layout-changed[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata"'
set-hook -g 'session-window-changed[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata"'
set-hook -g 'client-resized[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata"'
set-hook -g 'client-attached[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata"'
set-hook -g 'client-detached[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata --clear-client #{hook_client}"'
set-hook -g 'client-focus-in[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata"'
set-hook -g 'client-session-changed[90]' 'run-shell -b "~/.tmux/bin/emit-pane-metadata"'
run-shell -b '~/.tmux/bin/emit-pane-metadata'

# ------------ PANE DIMMING END -----------------

# 1. Faster command response
set -s escape-time 0

# 2. Start numbering at 1 for easier switching (keyboard 1-9 are closer than 0)
set -g base-index 1
setw -g pane-base-index 1

# 3. Reload config easily
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind V split-window -h -c "#{pane_current_path}"
bind S split-window -v -c "#{pane_current_path}"

bind s choose-session

# VIM stuff
# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# If you use C-\ for "last pane", add this too:
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Optional: Add copy-mode support
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Copy to clipboard
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -g extended-keys on
set -g extended-keys-format csi-u

# Initialize TMUX plugin manager before overriding popup bindings.
run '~/.tmux/plugins/tpm/tpm'

# Suspend pane dimming while tmux draws UI above the pane layer.
bind W run-shell -b "~/.tmux/bin/display-popup worktrees #{client_name} #{pane_id}"
bind G run-shell -b "~/.tmux/bin/display-popup lazygit #{client_name} #{pane_id}"

set -g status-right-length 120
